user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
	worker_connections 1024;
	multi_accept on;
}

http {

	##
	# Rate Limiting Zones (Enhanced)
	##
	limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
	limit_req_zone $binary_remote_addr zone=auth_limit:1m rate=10r/s;
	limit_req_zone $binary_remote_addr zone=upload_limit:1m rate=5r/s;
	limit_req_zone $binary_remote_addr zone=search_limit:10m rate=20r/s;

	##
	# Connection Limiting
	##
	limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

	##
	# Basic Settings
	##

	sendfile on;
	tcp_nopush on;
	tcp_nodelay on;
	types_hash_max_size 2048;
	server_tokens off;
	keepalive_timeout 65;
	client_max_body_size 10M;

	# Security Headers (Global)
	add_header X-Frame-Options "SAMEORIGIN" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-XSS-Protection "1; mode=block" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
	add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

	# CORS Headers for Flutter Mobile (Backup)
	add_header Access-Control-Allow-Origin "app://*" always;
	add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
	add_header Access-Control-Allow-Headers "Content-Type, Authorization, Accept, Origin, X-Requested-With" always;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	##
	# SSL Settings (Enhanced Security)
	##

	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
	ssl_prefer_server_ciphers off;
	ssl_session_cache shared:SSL:10m;
	ssl_session_timeout 1d;
	ssl_stapling on;
	ssl_stapling_verify on;

	##
	# Logging Settings
	##

	log_format main '$remote_addr - $remote_user [$time_local] "$request" '
	                '$status $body_bytes_sent "$http_referer" '
	                '"$http_user_agent" "$http_x_forwarded_for" '
	                '$request_time $upstream_response_time';

	access_log /var/log/nginx/access.log main;

	##
	# Gzip Settings
	##

	gzip on;
	gzip_vary on;
	gzip_proxied any;
	gzip_comp_level 6;
	gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

	##
	# Buffer Settings
	##

	client_body_buffer_size 16k;
	client_header_buffer_size 1k;
	large_client_header_buffers 4 8k;
	output_buffers 1 32k;
	postpone_output 1460;

	##
	# Timeouts
	##

	client_body_timeout 12;
	client_header_timeout 12;
	send_timeout 10;

	##
	# Virtual Host Configs
	##

	include /etc/nginx/conf.d/*.conf;
	include /etc/nginx/sites-enabled/*;
}